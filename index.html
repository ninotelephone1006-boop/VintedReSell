<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light dark">
<title>Resell – Dashboard Vinted</title>
<script>
/* Applique le thème avant le premier affichage (évite le flash blanc) */
(function(){try{var p=JSON.parse(localStorage.getItem('vd_pref')||'{}'),t=p.theme||'auto',d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}})();
</script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#86868b;--bl:#0071e3;--ac-tx:#fff;--ac2:#34c759;--gr:#248a3d;--rd:#d70015;--ln:#e5e5ea;--fill:#f2f2f7;
 --seg:#e8e8ed;--segon:#fff;--hov:#0000000a;--glass:rgba(255,255,255,.78);--tipbg:#1d1d1fe6;--tiptx:#fff;--ph:#c7c7cc;--dash:#d1d1d6;
 --sh:0 1px 2px #0000000a,0 8px 24px #0000000a;--shh:0 14px 34px #00000018;--sh2:0 1px 2px #0000000f;--nav-h:62px;color-scheme:light}
:root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--gr:#30d158;--rd:#ff453a;--ln:#38383a;--fill:#2c2c2e;
 --seg:#2c2c2e;--segon:#48484a;--hov:#ffffff12;--glass:rgba(28,28,30,.78);--tipbg:#48484af2;--tiptx:#f5f5f7;--ph:#48484a;--dash:#48484a;
 --sh:0 0 0 1px #ffffff0f;--shh:0 0 0 1px #ffffff1f,0 14px 34px #0008;--sh2:0 0 0 1px #ffffff14;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
aside{width:236px;position:sticky;top:0;height:100vh;height:100dvh;padding:24px 14px;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;z-index:5;flex:none}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em;padding:4px 12px 20px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;transition:background .2s,color .2s}
.nav:hover{background:var(--hov)}.nav.on,.nav.on:hover{background:var(--bl);color:var(--ac-tx)}
.nav em{margin-left:auto;font-style:normal;font-size:12px;opacity:.7}
.nav.mob,.mbrand,.fab{display:none}
main{flex:1;min-width:0;padding:22px clamp(16px,4vw,44px) 60px;max-width:1180px}
.top{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--card);border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer;box-shadow:var(--sh2);max-width:100%}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mu);flex:none}
.pill.ok i{background:#34c759}.pill.busy i{background:#ff9f0a;animation:pulse 1s infinite}.pill.err i{background:#ff3b30}
@keyframes pulse{50%{opacity:.3}}
.ibtn{border:0;background:var(--card);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh2);flex:none}
h1{font-size:32px;font-weight:700;letter-spacing:-.03em}
h2{font-size:19px;letter-spacing:-.02em}
.sub{color:var(--mu);margin-top:2px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
#view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--sh);margin-bottom:18px;transition:background .3s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0 18px}
.stats .card{margin:0;min-width:0}.stats small{color:var(--mu);font-size:13px}
.stats b{display:block;font-size:clamp(20px,5.4vw,28px);letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--gr)}.neg{color:var(--rd)}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.leg{display:flex;gap:14px;color:var(--mu);font-size:13px;margin-top:4px;flex-wrap:wrap}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.seg{display:inline-flex;background:var(--seg);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap}
.seg .on{background:var(--segon);box-shadow:0 1px 3px #0002}
.chart{position:relative;touch-action:pan-y;min-width:0}.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg{stroke:none;stroke-width:1}.chart .ln{stroke-width:2.5}.chart .dot{stroke-width:2.5}.chart .gl,.chart .guide{stroke-width:1}
.gl{stroke:var(--ln)}.ax{fill:var(--mu);font-size:11px}.guide{stroke:var(--dash)}.dot{fill:var(--card)}
.ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tip{position:absolute;top:0;background:var(--tipbg);color:var(--tiptx);border-radius:10px;padding:8px 11px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:2}
.tip b{display:block;margin-bottom:2px}
.bar{height:10px;background:var(--fill);border-radius:9px;overflow:hidden;margin:14px 0 8px}
.bar div{height:100%;background:var(--bl);border-radius:9px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.goal{display:flex;gap:10px;align-items:center}
.btn{border:0;background:var(--bl);color:var(--ac-tx);padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:500;transition:filter .2s,transform .1s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--fill);color:var(--tx)}.btn.sm{padding:6px 12px;font-size:13px}.btn.red{background:var(--fill);color:var(--rd)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:0 12px;color:var(--mu);box-shadow:var(--sh2)}
.search input{border:0;outline:0;background:none;padding:9px 0;width:100%;min-width:0;color:var(--tx)}
select,.fld input{background:var(--fill);border:0;border-radius:10px;padding:9px 12px;outline:0;min-width:0}
.tools select{background:var(--card);box-shadow:var(--sh2)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:16px}
.item{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s;animation:in .35s ease both;min-width:0}
.item:hover{transform:translateY(-3px);box-shadow:var(--shh)}
.ph{position:relative;aspect-ratio:1;background:var(--fill);display:grid;place-items:center;color:var(--ph)}
.ph svg{width:44px;height:44px}.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge.b{background:color-mix(in srgb,var(--bl) 15%,var(--card));color:var(--bl)}.badge.g{background:color-mix(in srgb,var(--gr) 15%,var(--card));color:var(--gr)}
.bd{padding:14px 16px 16px}.bd h3{font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dl{margin:10px 0 14px;display:grid;gap:4px}dl div{display:flex;justify-content:space-between;gap:10px;font-size:14px}dt{color:var(--mu)}dd{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.act{display:flex;gap:6px;flex-wrap:wrap}.act .btn:first-child{flex:1}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:70px 20px;background:var(--card);border-radius:20px}
dialog{border:0;border-radius:22px;padding:26px;width:min(440px,92vw);max-height:92vh;max-height:92dvh;background:var(--card);color:var(--tx);box-shadow:0 30px 80px #0004;animation:pop .25s cubic-bezier(.2,.9,.3,1.2);overscroll-behavior:contain}

@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes sheet{from{opacity:.4;transform:translateY(60px)}}
dialog form{display:grid;gap:14px;margin-top:16px}
.fld{display:grid;gap:5px;font-size:13px;color:var(--mu)}.fld input{color:var(--tx);font-size:15px;width:100%}
.up{display:grid;place-items:center;aspect-ratio:16/9;border-radius:14px;background:var(--fill);color:var(--mu);cursor:pointer;overflow:hidden;border:1.5px dashed var(--dash);transition:border-color .2s;font-size:14px}
.up:hover,.up.drag{border-color:var(--bl)}.up img{width:100%;height:100%;object-fit:cover}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.note{font-size:13px;color:var(--mu)}
.set h3{font-size:13px;font-weight:600;color:var(--mu);margin-bottom:10px;letter-spacing:.01em}
.set+.set{margin-top:22px;padding-top:20px;border-top:1px solid var(--ln)}
.set .seg{display:flex}.set .seg button{flex:1}
.lbl{font-size:13px;color:var(--mu);margin:16px 0 10px}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--c);position:relative;transition:transform .15s;display:grid;place-items:center;color:var(--t)}
.sw:hover{transform:scale(1.08)}
.sw svg{width:16px;height:16px;stroke-width:2.6;opacity:0;transform:scale(.6);transition:.2s}
.sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}.sw.on svg{opacity:1;transform:none}
.sw.custom{background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#0a84ff,#af52de,#ff2d55,#ff3b30);overflow:hidden}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw.custom.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--bl)}
.sw.custom svg{color:#fff;filter:drop-shadow(0 0 2px #0008)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- Mobile ---------- */
@media(max-width:820px){
 body{flex-direction:column}
 aside{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--ln)}
 .brand,#gear{display:none}
 .nav,.nav.mob{display:flex;flex:1;width:auto;min-width:0;flex-direction:column;gap:3px;font-size:11px;font-weight:500;padding:7px 2px;justify-content:center;align-items:center;text-align:center;color:var(--mu);border-radius:12px}
 .nav svg{width:22px;height:22px}.nav em{display:none}
 .nav.on,.nav.on:hover{background:none;color:var(--bl)}
 main{padding:0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:100%;width:100%}
 .top{position:sticky;top:0;z-index:4;margin:0 -16px 10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);gap:8px}
 .mbrand{display:block;font-weight:700;font-size:19px;letter-spacing:-.02em;margin-right:auto}
 .ibtn{width:38px;height:38px}
 .pill{padding:8px 13px;min-height:38px}
 h1{font-size:27px}h2{font-size:18px}
 .hd{margin-bottom:14px}.hd .btn[data-a=add]{display:none}
 .stats{gap:10px;margin:14px 0}
 .card{padding:16px;border-radius:18px;margin-bottom:14px}
 .stats .card{padding:14px}
 .chead .seg{width:100%}.chead .seg button{flex:1;padding:8px 6px}
 .goal{width:100%;justify-content:space-between}
 .tools{gap:8px;margin-bottom:16px}
 .search{flex:1 1 100%;min-width:0}
 .tools .seg{flex:1 1 100%}.tools .seg button{flex:1;padding:8px 6px}
 .tools select{flex:1 1 calc(50% - 4px)}
 .grid{gap:14px}.ph{aspect-ratio:16/10}
 .act{display:grid;grid-template-columns:1fr 1fr;gap:8px}.act .btn:first-child{grid-column:1/-1}.act .btn{text-align:center}
 .fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--bl);color:var(--ac-tx);box-shadow:0 8px 24px #0004;cursor:pointer;place-items:center;transition:transform .15s}
 .fab:not([hidden]){display:grid}
 .fab:active{transform:scale(.92)}.fab svg{width:26px;height:26px;stroke-width:2.2}
 #toast{bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px))}
}
/* Tactile : cibles ≥ 44 px, police 16 px (évite le zoom iOS) */
@media(max-width:820px),(pointer:coarse){
 .btn,.seg button,select,.fld input,.search input{min-height:44px}
 .btn.sm{min-height:40px;padding:8px 14px}
 input,select{font-size:16px!important}
 .fld input{padding:10px 12px}
 .seg button{padding-top:9px;padding-bottom:9px}
 .nav{min-height:44px}
 .ibtn{width:40px;height:40px}
}
@media(max-width:600px){
 dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92dvh;animation:sheet .32s cubic-bezier(.2,.9,.3,1)}
 dialog::before{content:"";display:block;width:38px;height:5px;border-radius:9px;background:var(--dash);margin:-10px auto 14px}
 .foot{flex-wrap:wrap}.foot .btn{flex:1 1 calc(50% - 4px);min-height:48px}.foot .btn:last-child{flex-basis:100%}
 .sw{width:40px;height:40px}.sws{gap:12px}
}
@media(max-width:380px){
 dialog .row{flex-direction:column}
 .stats b{font-size:20px}.seg button{font-size:12px}
}
@media(max-width:600px) and (min-width:381px){.stats .card{padding:14px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ln{stroke-dashoffset:0}}
</style>

<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const I=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const ICON={home:I('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),sale:I('<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/>'),sold:I('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'),search:I('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),img:I('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/>'),gear:I('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
 sun:I('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),moon:I('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),plus:I('<path d="M12 5v14M5 12h14"/>'),check:I('<path d="M5 12.5l4.5 4.5L19 7.5"/>')};
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>fmt(new Date());
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const sum=(a,f)=>a.reduce((t,i)=>t+f(i),0);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const jp=(k,d)=>{try{return JSON.parse(ls.get(k)||'null')||d}catch(e){return d}};

let D=norm(null),cfg=jp('vd_cfg',{}),pref={theme:'auto',accent:'#0071e3',...jp('vd_pref',{})},view='home',range='7',S={q:'',sort:'new',f:'all',per:'all'},tmp='',loaded=false;
function norm(j){return{settings:{goal:0,...(j&&j.settings)},items:Array.isArray(j&&j.items)?j.items:[]}}
const sold=()=>D.items.filter(i=>i.status==='sold'),onSale=()=>D.items.filter(i=>i.status!=='sold');

/* ---------- Thème & couleur secondaire ---------- */
const PRESETS=[['Bleu','#0071e3'],['Violet','#af52de'],['Rose','#ff2d55'],['Rouge','#ff3b30'],['Orange','#ff9500'],['Jaune','#ffcc00'],['Vert','#2fa24f'],['Turquoise','#00b5c4'],['Graphite','#636366']];
const rgb=h=>{h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const hex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mixc=(a,b,t)=>{const x=rgb(a),y=rgb(b);return hex(x.map((v,i)=>v+(y[i]-v)*t))};
const lum=h=>{const[r,g,b]=rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const onColor=h=>{const L=lum(h);return(1.05)/(L+.05)>=(L+.05)/(lum('#1d1d1f')+.05)?'#fff':'#1d1d1f'};
const hue=h=>{const[r,g,b]=rgb(h).map(v=>v/255),M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;if(!d)return 0;const k=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;return(k*60+360)%360};
const isHex=v=>/^#[0-9a-f]{6}$/i.test(v);

/* ---------- Synchronisation en ligne via data.json ---------- */
let timer,busy=false,dirty=false;
const pill=$('#pill');
function setSt(c,t){pill.className='pill '+c;$('span',pill).textContent=t}
const DATA_URL='data.json';
const WORKER_URL=()=> (cfg.workerUrl||'').trim().replace(/\/$/,'');
function dataGetUrl(){
 const w=WORKER_URL();
 if(w) return w+'/data';
 return DATA_URL;
}
function dataPutUrl(){
 const w=WORKER_URL();
 if(w) return w+'/data';
 return DATA_URL;
}
async function pull(){
 setSt('busy','Chargement…');
 try{
  const url=dataGetUrl()+(dataGetUrl().includes('?')?'&':'?')+'t='+Date.now();
  const headers={};
  if(WORKER_URL() && cfg.workerAuth) headers['X-Auth']=cfg.workerAuth;
  const r=await fetch(url,{cache:'no-store',headers});
  if(!r.ok) throw r.status;
  let j;
  try{ j=await r.json(); }catch{ j=null; }
  // Supporte à la fois {items:[]} et {} vide
  if(j && Array.isArray(j.items)){
    D=norm(j);
  } else if(j && (j.settings || j.items)){
    D=norm(j);
  } else if(!j || Object.keys(j).length===0){
    // data.json vide → on garde D local et on pousse une première fois si possible
    if(D.items.length===0 && !D.settings.goal) { /* rien à faire */ }
  }
  loaded=true;
  setSt('ok','En ligne');
 }catch(e){
  console.warn('pull error',e);
  if(e===404) setSt('err','data.json introuvable');
  else setSt('err','Hors ligne');
  loaded=true;
 }
 render();
}
function save(){
 if(!loaded) return;
 setSt('busy','Synchronisation…');
 clearTimeout(timer);
 timer=setTimeout(push,400);
}
async function push(){
 if(busy){dirty=true;return}
 busy=true;
 setSt('busy','Synchronisation…');
 try{
  const url=dataPutUrl();
  const headers={'Content-Type':'application/json'};
  if(WORKER_URL() && cfg.workerAuth) headers['X-Auth']=cfg.workerAuth;
  const body=JSON.stringify(D,null,2);
  const r=await fetch(url,{method:'PUT',headers,body});
  if(!r.ok) throw r.status;
  setSt('ok','Synchronisé');
 }catch(e){
  console.warn('push error',e);
  setSt('err','Erreur sauvegarde');
 }
 busy=false;
 if(dirty){dirty=false;push()}
}
// Re-synchronise quand on revient sur l'onglet (multi-appareils)
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && loaded) pull(); });
setInterval(()=>{ if(loaded && !busy) pull(); }, 30000);

function series(){
 const s=sold().filter(i=>i.soldAt),n=range==='12'?12:+range,B=[],now=new Date();
 for(let k=n-1;k>=0;k--){
  const d=new Date(now.getFullYear(),now.getMonth(),range==='12'?1:now.getDate(),12);
  range==='12'?d.setMonth(d.getMonth()-k):d.setDate(d.getDate()-k);
  const key=range==='12'?fmt(d).slice(0,7):fmt(d),f=s.filter(i=>i.soldAt.startsWith(key));
  B.push({lab:range==='12'?d.toLocaleDateString('fr-FR',{month:'short'}):`${d.getDate()}/${d.getMonth()+1}`,tip:range==='12'?d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}):d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}),rev:sum(f,i=>i.sold),pro:sum(f,i=>i.sold-i.buy),n:f.length});
 }
 return B;
}
let chartW=0;
function drawChart(){
 const box=$('#chart');if(!box)return;
 $$('.bar div').forEach(b=>requestAnimationFrame(()=>b.style.width=b.dataset.w+'%'));
 /* Le graphique s’adapte à la largeur réelle : textes lisibles sur téléphone */
 const W=chartW=Math.max(260,Math.round(box.clientWidth||720)),small=W<520,H=small?230:270,L=small?44:56,R=small?10:14,T=14,Bt=30;
 const B=series(),n=B.length;
 const mx=Math.max(1,...B.map(b=>Math.max(b.rev,b.pro))),mn=Math.min(0,...B.map(b=>b.pro)),x=i=>L+i*(W-L-R)/(n-1),y=v=>T+(mx-v)/(mx-mn)*(H-T-Bt);
 const path=k=>B.map((b,i)=>{const X=x(i),Y=y(b[k]);if(!i)return`M${X},${Y}`;const p=x(i-1),q=y(B[i-1][k]);return`C${(p+X)/2},${q} ${(p+X)/2},${Y} ${X},${Y}`}).join(' ');
 const grid=[0,1,2,3].map(k=>{const v=mn+(mx-mn)*k/3;return`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v)} €</text>`}).join('');
 const step=Math.ceil(n/Math.max(2,Math.floor((W-L-R)/(small?44:60)))),labs=B.map((b,i)=>(n-1-i)%step===0?`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${b.lab}</text>`:'').join('');
 const any=B.some(b=>b.n);
 box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d’affaires et bénéfices"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bl)" stop-opacity=".22"/><stop offset="1" style="stop-color:var(--bl)" stop-opacity="0"/></linearGradient></defs>${grid}${labs}
 <path d="${path('rev')} L${x(n-1)},${y(mn)} L${x(0)},${y(mn)}Z" fill="url(#g)"/>
 <path class="ln" pathLength="1" d="${path('rev')}" style="stroke:var(--bl)"/><path class="ln" pathLength="1" d="${path('pro')}" style="stroke:var(--ac2)"/>
 <line class="guide" id="gd" y1="${T}" y2="${H-Bt}" opacity="0"/><circle class="dot" id="d1" r="5" style="stroke:var(--bl)" stroke-width="2.5" opacity="0"/><circle class="dot" id="d2" r="5" style="stroke:var(--ac2)" stroke-width="2.5" opacity="0"/>
 ${any?'':`<text class="ax" x="${W/2}" y="${H/2}" text-anchor="middle" font-size="14" style="font-size:14px">Aucune vente sur cette période</text>`}</svg><div class="tip" id="tip"></div>`;
 const tip=$('#tip');
 const show=e=>{const r=box.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((px-L)/((W-L-R)/(n-1))))),b=B[i];
  $('#gd').setAttribute('x1',x(i));$('#gd').setAttribute('x2',x(i));$('#d1').setAttribute('cx',x(i));$('#d1').setAttribute('cy',y(b.rev));$('#d2').setAttribute('cx',x(i));$('#d2').setAttribute('cy',y(b.pro));
  ['gd','d1','d2'].forEach(k=>$('#'+k).setAttribute('opacity',1));
  tip.innerHTML=`<b>${b.tip}</b>CA ${eur(b.rev)}<br>Bénéfice ${eur(b.pro)}<br>${b.n} vente${b.n>1?'s':''}`;
  const hw=tip.offsetWidth/2+4;tip.style.left=Math.max(hw,Math.min(r.width-hw,x(i)/W*r.width))-hw+4+'px';tip.style.opacity=1};
 box.onpointermove=box.onpointerdown=show;
 box.onpointerleave=box.onpointercancel=()=>{tip.style.opacity=0;['gd','d1','d2'].forEach(k=>$('#'+k)&&$('#'+k).setAttribute('opacity',0))};
}

  </div>
 </section>`;
 $('#f').onsubmit=e=>{e.preventDefault();const v=new FormData(e.target);cfg={workerUrl:v.get('w').trim().replace(/\/$/,''),workerAuth:v.get('a').trim()};ls.set('vd_cfg',JSON.stringify(cfg));dlg.close();toast('Réglages enregistrés');pull()};
 applyPref();dlg.showModal();
}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2200)}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-v],[data-a],[data-r],[data-f],[data-th],[data-ac]');if(!t)return;
 const d=t.dataset,it=d.id&&D.items.find(i=>i.id===d.id);
 if(d.v)return go(d.v);
 if(d.th)return setPref({theme:d.th});
 if(d.ac)return setPref({accent:d.ac});
 if(d.r){range=d.r;$$('[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===range));return drawChart()}
 if(d.f){S.f=d.f;$$('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===S.f));return list()}
 ({add:()=>itemForm(),edit:()=>itemForm(d.id),sell:()=>sellForm(d.id),cfg:cfgForm,close:()=>dlg.close(),
  theme:()=>setPref({theme:isDark()?'light':'dark'}),
  rmph:()=>{tmp='';$('#up').innerHTML=upHtml();t.remove()},
  del:()=>{if(confirm(`Supprimer « ${it.name} » ?`)){D.items=D.items.filter(i=>i!==it);save();render();toast('Article supprimé')}},
  unsell:()=>{it.status='sale';delete it.sold;delete it.soldAt;save();render();toast('Article remis en vente')},
  sync:()=>pull(),
  reload:()=>pull(),
  export:()=>{ const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a');a.href=u;a.download='data.json';a.click();URL.revokeObjectURL(u); toast('Export téléchargé')})[d.a]();
});
document.addEventListener('input',e=>{
 if(e.target.id==='cacc')return setPref({accent:e.target.value});
 if(e.target.id==='q'){S.q=e.target.value;list()}
 if(e.target.id==='goal'){D.settings.goal=Math.max(0,num(e.target.value));save();const g=D.settings.goal,m=today().slice(0,7),mp=sum(sold().filter(i=>(i.soldAt||'').startsWith(m)),i=>i.sold-i.buy),p=g?Math.max(0,Math.min(100,mp/g*100)):0;$('.bar div').style.width=p+'%';$('.row.note span:last-child').textContent=g?Math.round(p)+' % de '+eur(g):'Définissez un objectif pour suivre votre progression'}
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){S.sort=e.target.value;list()}if(e.target.id==='per'){S.per=e.target.value;list()}});
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});

applyPref();render();pull();
</script>
</body>
</html>
